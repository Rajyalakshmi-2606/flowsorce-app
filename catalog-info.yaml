  description: The repository contains the BSPlugins integrating the diffrent channels (Web, Skype for business, Cortana, WebEx Teams, MS Teams*, Twilio* & Custom Channels) into HiveCenter Chatops Engine. The interface provides single endpoint for tapping into the features offered part of the I&O automation platform.
